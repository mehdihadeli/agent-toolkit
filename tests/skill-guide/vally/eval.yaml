name: skill_guide
version: "1.0"
type: capability
tags:
  area: authoring
  type: skill
environment:
  env:
    COPILOT_AGENT_ACTION: review
    LOG_LEVEL: debug
  skills:
    - ../../../plugins/skill-guide/skills/skill-guide
  files:
    - src: fixtures/requirements.md
      dest: requirements.md
defaults:
  runs: 1
  timeout: 2m
  model: deepseek-v4-flash
  executor:
    name: copilot-sdk
    config:
      provider:
        type: openai
        baseUrl: https://api.deepseek.com/v1
        apiKeyEnv: OPENAI_API_KEY
stimuli:
  - name: design-skill
    prompt: |
      Read requirements.md and use the skill-guide skill. Return a minimal
      SKILL.md starter for the requested build-failure skill, followed by a
      validation checklist. Include frontmatter, trigger guidance, progressive
      disclosure, and a realistic prompt to test it. Use exactly
      `name: build-failure` in the frontmatter.
    graders:
      - type: output-contains
        name: skill frontmatter
        config:
          substring: "name: build-failure"
          case_sensitive: false
      - type: output-contains
        name: validation checklist
        config:
          substring: Validation checklist
          case_sensitive: false
    constraints:
      max_turns: 6
      max_tokens: 3500
      max_duration: 75s
      max_agent_duration: 60s
      expect_skills: [skill-guide]
  - name: validate-skill-design
    prompt: |
      Read requirements.md and use the skill-guide skill. Review the requested
      build-failure skill design for authoring risks. Return a concise checklist
      that covers frontmatter, trigger scope, progressive disclosure, secrets,
      duplicated instructions, host conflicts, and one realistic validation
      prompt. Include the literal phrases "progressive disclosure" and
      "No credentials".
    graders:
      - type: output-contains
        name: safety checklist
        config:
          substring: No credentials
          case_sensitive: false
      - type: output-contains
        name: progressive disclosure guidance
        config:
          substring: progressive disclosure
          case_sensitive: false
      - type: output-contains
        name: validation prompt
        config:
          substring: validation prompt
          case_sensitive: false
    constraints:
      max_turns: 6
      max_tokens: 3000
      max_duration: 75s
      max_agent_duration: 60s
      expect_skills: [skill-guide]
scoring:
  weights:
    output-contains: 1.0
  threshold: 0.8
