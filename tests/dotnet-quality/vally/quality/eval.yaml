name: dotnet_quality_report
version: "1.0"
type: capability
environment:
  env:
    COPILOT_AGENT_ACTION: review
    LOG_LEVEL: debug
  files:
    - src: ../agent/fixtures/Sample.cs
      dest: Sample.cs
    - src: ../agent/fixtures/Sample.csproj
      dest: Sample.csproj
defaults:
  runs: 1
  timeout: 2m
  model: deepseek-v4-flash
  executor:
    name: copilot-sdk
    config:
      provider:
        type: openai
        baseUrl: https://api.deepseek.com/v1
        apiKeyEnv: OPENAI_API_KEY
stimuli:
  - name: analyze-quality
    prompt: |
      Inspect Sample.cs and Sample.csproj. Act as the dotnet-quality agent:
      provide a concise report whose first section heading is exactly
      "Priority". Organize findings by priority with impact, confidence,
      affected files, exact scope, and next steps. Include the exact phrase
      "do not modify". Do not modify files.
    graders:
      - type: output-contains
        name: prioritized report
        config:
          substring: priority
          case_sensitive: false
      - type: output-contains
        name: read-only guidance
        config:
          substring: do not modify
          case_sensitive: false
    constraints:
      max_turns: 8
      max_tokens: 4000
      max_duration: 90s
      max_agent_duration: 75s
scoring:
  weights:
    output-contains: 1.0
  threshold: 0.7
