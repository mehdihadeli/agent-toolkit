name: search_mcp
description: Behavioral coverage for all five Search MCP tools against public documentation sources.
version: "1.0"
type: capability
tags:
  area: search
  type: capability
environment:
  mcpServers:
    agent-toolkit-search:
      type: stdio
      command: dotnet
      cwd: .
      args:
        - run
        - --project
        - plugins/search/mcps/search/AgentSkillsMcp.Search.csproj
        - --no-launch-profile
      timeout: 30s
      env:
        LOG_LEVEL: debug
defaults:
  runs: 1
  timeout: 2m
  model: deepseek-v4-flash
  executor:
    name: copilot-sdk
    config:
      provider:
        type: openai
        baseUrl: https://api.deepseek.com/v1
        apiKeyEnv: OPENAI_API_KEY
stimuli:
  - name: fetch-http-standard
    tags:
      priority: p0
      cost: low
    prompt: |
      Call only the agent-toolkit-search MCP tool named fetch now, with url
      https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/overview
      and format readable. Wait for the fetch result. Report the document title
      and one practical change or feature described in the .NET 10
      documentation. Include the official Microsoft Learn URL. Do not modify
      files.
    graders:
      - type: completed
      - type: output-contains
        name: .NET documentation identified
        config:
          substring: What's new in .NET 10
          case_sensitive: false
      - type: tool-calls
        name: fetch tool used
        config:
          required: [fetch]
      - type: output-matches
        name: official URL returned
        config:
          pattern: https://learn\.microsoft\.com/en-us/dotnet/core/whats-new/dotnet-10/overview
    constraints:
      max_turns: 5
      max_tokens: 2500
      max_duration: 150s
      max_agent_duration: 120s
      expect_tools: [fetch]
  - name: research-with-citations
    tags:
      priority: p1
      cost: high
    prompt: |
      Call only the agent-toolkit-search MCP tool named research now with question
      "what is HTTP". Wait for the research result, then return a concise
      answer with cited source links. Include the word HTTP in the answer. Do
      not use uncited general knowledge when the tool returns no sources.
    graders:
      - type: completed
      - type: output-contains
        name: cited answer
        config:
          substring: http
          case_sensitive: false
      - type: tool-calls
        name: research tool used
        config:
          required: [research]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [research]
  - name: search-dotnet-documentation
    tags:
      priority: p1
      cost: high
    prompt: |
      Call only the agent-toolkit-search MCP tool named search now with query
      "site:learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/overview
      what's new in .NET 10". Wait for the search result, then return two
      relevant result titles with their source URLs. Return at least one
      learn.microsoft.com source and do not invent results.
    graders:
      - type: completed
      - type: output-contains
        name: Microsoft Learn source returned
        config:
          substring: learn.microsoft.com
          case_sensitive: false
      - type: tool-calls
        name: search tool used
        config:
          required: [search]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [search]
  - name: crawl-dotnet-documentation
    tags:
      priority: p1
      cost: high
    prompt: |
      Call only the agent-toolkit-search MCP tool named crawl now with url
      .NET 10 overview page:
      https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/overview
      and arguments max_pages=1 and max_depth=0. Wait for the crawl result.
      Report the page heading plus one .NET 10 feature found in returned
      content. Do not leave the Microsoft Learn origin.
    graders:
      - type: completed
      - type: output-contains
        name: .NET page found
        config:
          substring: .NET 10
          case_sensitive: false
      - type: tool-calls
        name: crawl tool used
        config:
          required: [crawl]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [crawl]
  - name: discover-mcp-llms-metadata
    tags:
      priority: p0
      cost: low
    prompt: |
      Call only the agent-toolkit-search MCP tool named discover_llms_txt now with url
      https://agentgateway.dev/docs/llms.txt. Then summarize the returned
      agentgateway documentation and include its source URL. Wait for the tool
      result and use it as your source.
    graders:
      - type: completed
      - type: output-contains
        name: llms metadata reported
        config:
          substring: llms.txt
          case_sensitive: false
      - type: tool-calls
        name: llms discovery tool used
        config:
          required: [discover_llms_txt]
      - type: output-matches
        name: metadata URL returned
        config:
          pattern: https://agentgateway\.dev/docs/llms\.txt
    constraints:
      max_turns: 5
      max_tokens: 2500
      expect_tools: [discover_llms_txt]
scoring:
  weights:
    completed: 0.1
    output-contains: 0.3
    output-matches: 0.2
    tool-calls: 0.4
  threshold: 0.7
