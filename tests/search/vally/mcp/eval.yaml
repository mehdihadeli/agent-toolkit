name: handy_search_mcp
version: "1.0"
type: capability
environment:
  mcpServers:
    agent-toolkit-search:
      type: http
      url: http://127.0.0.1:6243
      timeout: 30s
defaults:
  runs: 1
  timeout: 2m
  executor: copilot-sdk
stimuli:
  - name: fetch-public-page
    prompt: |
      Use the agent-toolkit-search MCP fetch tool to fetch
      https://example.com as readable text. Report the page title or heading
      and one fact from the returned content. Do not modify files.
    graders:
      - type: output-contains
        name: example content
        config:
          substring: Example Domain
          case_sensitive: false
      - type: tool-calls
        name: fetch tool used
        config:
          required: [fetch]
    constraints:
      max_turns: 5
      max_tokens: 2500
      expect_tools: [fetch]
  - name: research-with-citations
    prompt: |
      Use the agent-toolkit-search MCP research tool to research "what is HTTP" and
      return a concise answer with cited source links. Do not use uncited
      general knowledge when the tool returns no sources.
    graders:
      - type: output-contains
        name: cited answer
        config:
          substring: http
          case_sensitive: false
      - type: tool-calls
        name: research tool used
        config:
          required: [research]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [research]
scoring:
  weights:
    output-contains: 0.5
    tool-calls: 0.5
  threshold: 0.7
