name: search_mcp
description: Behavioral coverage for all five Search MCP tools against public documentation sources.
version: "1.0"
type: capability
tags:
  area: search
  type: capability
environment:
  mcpServers:
    agent-toolkit-search:
      type: stdio
      command: dotnet
      args:
        - run
        - --project
        - ../../../plugins/search/mcps/search/AgentSkillsMcp.Search.csproj
        - --no-launch-profile
      timeout: 30s
defaults:
  runs: 1
  timeout: 2m
  executor: copilot-sdk
stimuli:
  - name: fetch-http-standard
    tags:
      priority: p0
      cost: low
    prompt: |
      Use the agent-toolkit-search MCP fetch tool to fetch
      https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/overview
      as readable text. Report the document title and one practical change or
      feature described in the .NET 10 documentation. Include the official
      Microsoft Learn URL. Do not modify files.
    graders:
      - type: completed
      - type: output-contains
        name: .NET documentation identified
        config:
          substring: What's new in .NET 10
          case_sensitive: false
      - type: tool-calls
        name: fetch tool used
        config:
          required: [fetch]
      - type: output-matches
        name: official URL returned
        config:
          pattern: https://learn\.microsoft\.com/en-us/dotnet/core/whats-new/dotnet-10/overview
    constraints:
      max_turns: 5
      max_tokens: 2500
      expect_tools: [fetch]
  - name: research-with-citations
    tags:
      priority: p1
      cost: high
    prompt: |
      Use the agent-toolkit-search MCP research tool to research "what is HTTP" and
      return a concise answer with cited source links. Do not use uncited
      general knowledge when the tool returns no sources.
    graders:
      - type: completed
      - type: output-contains
        name: cited answer
        config:
          substring: http
          case_sensitive: false
      - type: tool-calls
        name: research tool used
        config:
          required: [research]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [research]
  - name: search-dotnet-documentation
    tags:
      priority: p1
      cost: high
    prompt: |
      Use the agent-toolkit-search MCP search tool to find official Microsoft
      Learn documentation about what's new in .NET 10. Return two relevant
      result titles with their source URLs. Prefer learn.microsoft.com sources
      and do not invent results.
    graders:
      - type: completed
      - type: output-contains
        name: Microsoft Learn source returned
        config:
          substring: learn.microsoft.com
          case_sensitive: false
      - type: tool-calls
        name: search tool used
        config:
          required: [search]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [search]
  - name: crawl-dotnet-documentation
    tags:
      priority: p1
      cost: high
    prompt: |
      Use the agent-toolkit-search MCP crawl tool to crawl this Microsoft Learn
      .NET 10 overview page:
      https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/overview
      Call crawl with max_pages=1 and max_depth=0. Report the page heading plus
      one .NET 10 feature found in the returned content. Do not leave the
      Microsoft Learn origin.
    graders:
      - type: completed
      - type: output-contains
        name: .NET page found
        config:
          substring: .NET 10
          case_sensitive: false
      - type: tool-calls
        name: crawl tool used
        config:
          required: [crawl]
    constraints:
      max_turns: 6
      max_tokens: 3000
      expect_tools: [crawl]
  - name: discover-mcp-llms-metadata
    tags:
      priority: p0
      cost: low
    prompt: |
      Call MCP tool discover_llms_txt with url
      https://agentgateway.dev/docs/llms.txt. Then summarize the returned
      agentgateway documentation and include its source URL. Use the tool result
      as your source.
    graders:
      - type: completed
      - type: output-contains
        name: llms metadata reported
        config:
          substring: llms.txt
          case_sensitive: false
      - type: tool-calls
        name: llms discovery tool used
        config:
          required: [discover_llms_txt]
      - type: output-matches
        name: metadata URL returned
        config:
          pattern: https://agentgateway\.dev/docs/llms\.txt
    constraints:
      max_turns: 5
      max_tokens: 2500
      expect_tools: [discover_llms_txt]
scoring:
  weights:
    completed: 0.1
    output-contains: 0.3
    output-matches: 0.2
    tool-calls: 0.4
  threshold: 0.7
