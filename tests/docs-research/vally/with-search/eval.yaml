name: docs_research_with_available_search
version: "1.0"
type: capability
environment:
  env:
    COPILOT_AGENT_ACTION: review
    LOG_LEVEL: debug
  skills:
    - ../../../../plugins/docs-research/skills/docs-research
  files:
    - src: ../fixtures/task.md
      dest: task.md
  mcpServers:
    agent-toolkit-search:
      type: stdio
      command: dotnet
      cwd: .
      args:
        - run
        - --project
        - plugins/search/mcps/search/AgentSkillsMcp.Search.csproj
        - --no-launch-profile
      timeout: 30s
defaults:
  runs: 1
  timeout: 3m
  model: deepseek-v4-flash
  executor:
    name: copilot-sdk
    config:
      provider:
        type: openai
        baseUrl: https://api.deepseek.com/v1
        apiKeyEnv: OPENAI_API_KEY
stimuli:
  - name: use-available-search-tool
    prompt: |
      Read task.md and use the docs-research skill. First inspect the tools
      available in this environment. Call agent-toolkit-search exactly once to
      find relevant official Vally documentation. Do not use web_search or
      web_fetch. Then return exactly these
      headings: What changed, What matters for this repo, Implementation
      checklist, Risks/unknowns. State which research tool you used and include
      the literal URL https://microsoft.github.io/vally as an official source.
      Do not claim tool use if it was unavailable.
    graders:
      - type: output-contains
        name: reports search tool use
        config:
          substring: agent-toolkit-search
          case_sensitive: false
      - type: output-contains
        name: includes checklist
        config:
          substring: Implementation checklist
          case_sensitive: false
      - type: output-contains
        name: includes official source
        config:
          substring: microsoft.github.io/vally
          case_sensitive: false
    constraints:
      max_turns: 6
      max_tokens: 3500
      max_duration: 150s
      max_agent_duration: 120s
      expect_skills: [docs-research]
      expect_tools: [agent-toolkit-search]
scoring:
  weights:
    output-contains: 1.0
  threshold: 0.8
