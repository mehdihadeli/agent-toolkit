name: docs_research_skill
version: "1.0"
type: capability
environment:
  env:
    COPILOT_AGENT_ACTION: review
    LOG_LEVEL: debug
  skills:
    - ../../../plugins/docs-research/skills/docs-research
  files:
    - src: fixtures/task.md
      dest: task.md
defaults:
  runs: 1
  timeout: 2m
  model: deepseek-v4-flash
  executor:
    name: copilot-sdk
    config:
      provider:
        type: openai
        baseUrl: https://api.deepseek.com/v1
        apiKeyEnv: OPENAI_API_KEY
stimuli:
  - name: produce-versioned-checklist
    prompt: |
      Read task.md and use the docs-research skill. Research the current Vally
      documentation approach for this task. No documentation research MCP is
      configured in this environment, so do not call or invent a research tool;
      use the official URL provided below as the source citation. Return exactly these headings:
      What changed, What matters for this repo, Implementation checklist,
      Risks/unknowns. Include this official source URL:
      https://microsoft.github.io/vally. Do not invent unknowns.
    graders:
      - type: output-contains
        name: checklist headings
        config:
          substring: Implementation checklist
          case_sensitive: false
      - type: output-contains
        name: source citation
        config:
          substring: microsoft.github.io/vally
          case_sensitive: false
    constraints:
      max_turns: 4
      max_tokens: 2500
      max_duration: 75s
      max_agent_duration: 60s
      expect_skills: [docs-research]
  - name: recommend-missing-research-tools
    prompt: |
      Read task.md and use the docs-research skill. This environment does not
      provide a configured documentation research MCP. Explain which useful
      research tools are unavailable, recommend installation or configuration
      steps for a suitable tool, and do not claim that you used a tool that is
      unavailable. Include the literal word `unavailable` in the response.
      Return the standard four headings from the skill.
    graders:
      - type: output-contains
        name: identifies unavailable tools
        config:
          substring: unavailable
          case_sensitive: false
      - type: output-contains
        name: recommends setup
        config:
          substring: install
          case_sensitive: false
      - type: output-contains
        name: includes risks
        config:
          substring: Risks/unknowns
          case_sensitive: false
    constraints:
      max_turns: 4
      max_tokens: 2500
      expect_skills: [docs-research]
scoring:
  weights:
    output-contains: 1.0
  threshold: 0.8
