name: .NET plugin tests

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**/agents/**"
      - "plugins/**/mcps/**"
      - "tests/**/unit-tests/**"
      - "tests/**/integration-tests/**"
      - "agent-toolkit.slnx"
      - "global.json"
      - ".github/workflows/dotnet-tests.yml"
  pull_request:
    paths:
      - "plugins/**/agents/**"
      - "plugins/**/mcps/**"
      - "tests/**/unit-tests/**"
      - "tests/**/integration-tests/**"
      - "agent-toolkit.slnx"
      - "global.json"
      - ".github/workflows/dotnet-tests.yml"
  workflow_dispatch:
    inputs:
      run_live_tavily:
        description: Run live Tavily SDK integration tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dotnet-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: .NET solution tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test --solution agent-toolkit.slnx

  live-tavily:
    name: Live Tavily SDK tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_tavily }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_RUN_LIVE_TESTS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Require Tavily API key
        shell: bash
        run: test -n "$TAVILY_API_KEY"

      - name: Run live Tavily SDK tests
        run: >-
          dotnet test
          --project tests/search/integration-tests/AgentSkillsMcp.Search.IntegrationTests.csproj
          --filter-class AgentSkillsMcp.Search.Tests.TavilySdkIntegrationTests
