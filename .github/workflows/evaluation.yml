name: Evaluation

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "tests/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - ".vally.yaml"
      - "global.json"
      - ".github/workflows/evaluation*.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "tests/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - ".vally.yaml"
      - "global.json"
      - ".github/workflows/evaluation*.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Vally lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install repository Node dependencies
        run: npm ci

      - name: Validate repository metadata and links
        run: make validate

      - name: Lint skills and evaluation configuration
        run: make vally-lint

  evaluate:
    name: Run Vally evaluation suite
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      Search__EnableTavily: ${{ vars.ENABLE_TAVILY_SEARCH || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install repository Node dependencies
        run: npm ci

      - name: Install Claude Code
        if: ${{ vars.ENABLE_CLAUDE_EVAL == 'true' }}
        run: npm install --global @anthropic-ai/claude-code

      - name: Build Claude Vally executor
        if: ${{ vars.ENABLE_CLAUDE_EVAL == 'true' }}
        run: |
          npm ci --prefix tools/vally-executor-claude
          npm run build --prefix tools/vally-executor-claude

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run Vally evaluation with Copilot
        run: make vally-eval-copilot-ci

      - name: Run Vally evaluation with Claude Code
        if: ${{ vars.ENABLE_CLAUDE_EVAL == 'true' }}
        run: make vally-eval-claude-ci

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vally-results-plugin-evals
          path: .work/vally/results/
          if-no-files-found: warn
          retention-days: 14
