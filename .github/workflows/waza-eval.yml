name: Waza skill evaluations

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**/skills/**"
      - ".github/agents/**"
      - "tests/**/waza/**"
      - "tools/run-waza.sh"
      - "mise.toml"
      - ".waza.yaml"
      - ".github/workflows/waza-eval.yml"
  pull_request:
    paths:
      - "plugins/**/skills/**"
      - ".github/agents/**"
      - "tests/**/waza/**"
      - "tools/run-waza.sh"
      - "mise.toml"
      - ".waza.yaml"
      - ".github/workflows/waza-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-evals:
    name: Waza trigger evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Validate repository metadata and Waza coverage
        run: mise run validate

      - name: Install pinned Waza
        env:
          WAZA_VERSION: "0.38.7"
          WAZA_SHA256: "e227cd884173de796bc28c6cb1828498f250297e0e606a4e4504d14465ff879f"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/microsoft/waza/releases/download/v${WAZA_VERSION}/waza-linux-amd64" \
            --output "$bin/waza"
          echo "${WAZA_SHA256}  $bin/waza" | sha256sum --check -
          chmod +x "$bin/waza"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run deterministic trigger evaluations
        env:
          WAZA_RESULTS_DIR: ${{ runner.temp }}/waza-results
        run: |
          set -euo pipefail
          mise run waza-eval-ci

      - name: Upload Waza results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: waza-results
          path: ${{ runner.temp }}/waza-results/
          if-no-files-found: warn
          retention-days: 14
