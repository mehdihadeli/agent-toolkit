# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/config.schema.json

paths:
  skills:
    - plugins/docs-research/skills
    - plugins/skill-guide/skills
    - plugins/planning/skills
  evals:
    - tests/docs-research/waza
    - tests/skill-guide/skills
    - tests/planning/waza
  results: .work/waza/results

defaults:
  engine: mock
  model: mock-model
  timeout: 30
  parallel: false
  verbose: false
  sessionLog: false

cache:
  enabled: false

tokens:
  warningThreshold: 500
  fallbackLimit: 5000
